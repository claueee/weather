<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#79bff6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sky" />
  <title>Sky — Local Weather</title>

  <style>
    :root {
      --text: rgba(255,255,255,.98);
      --muted: rgba(255,255,255,.67);
      --glass: rgba(255,255,255,.14);
      --glass-strong: rgba(255,255,255,.20);
      --stroke: rgba(255,255,255,.18);
      --shadow: 0 20px 60px rgba(0,0,0,.22);
      --top: #76c7ff;
      --mid: #5d92f2;
      --bottom: #4e4dc7;
      --orb: rgba(255,245,190,.95);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #4f6fc9;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button, input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 75% 12%, rgba(255,255,255,.18), transparent 28%),
        linear-gradient(165deg, var(--top), var(--mid) 48%, var(--bottom));
      transition: background 1.2s ease;
    }

    .app::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.04), transparent 36%),
        radial-gradient(circle at 50% 110%, rgba(12,18,50,.18), transparent 45%);
      z-index: -1;
    }

    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .blob {
      position: absolute;
      width: 58vw;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .22;
      background: white;
      animation: drift 13s ease-in-out infinite alternate;
    }

    .blob.one { top: -20%; right: -16%; }
    .blob.two { bottom: -25%; left: -22%; animation-delay: -5s; }

    @keyframes drift {
      from { transform: translate3d(-12px,-8px,0) scale(.96); }
      to   { transform: translate3d(28px,30px,0) scale(1.08); }
    }

    .shell {
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(34px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      margin-bottom: 8px;
    }

    .location-title {
      min-width: 0;
      flex: 1;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .place {
      margin: 0;
      font-size: 19px;
      font-weight: 660;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--stroke);
      border-radius: 50%;
      color: white;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 8px 24px rgba(0,0,0,.10);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .icon-btn:active { transform: scale(.94); }

    .search {
      display: none;
      gap: 8px;
      margin: 8px 0 16px;
      animation: reveal .22s ease-out;
    }

    .search.open { display: flex; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--stroke);
      outline: none;
      border-radius: 18px;
      padding: 12px 14px;
      color: white;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .search input::placeholder { color: rgba(255,255,255,.56); }

    .search button {
      border: 0;
      border-radius: 18px;
      padding: 0 16px;
      font-weight: 680;
      color: #25345d;
      background: rgba(255,255,255,.9);
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 22px 0 12px;
    }

    .weather-stage {
      position: relative;
      height: 180px;
      max-width: 420px;
      margin: 0 auto -8px;
      overflow: visible;
    }

    .sun {
      position: absolute;
      top: 18px;
      left: 50%;
      width: 104px;
      height: 104px;
      border-radius: 50%;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 42% 40%, #fff9d0 0 12%, #ffe486 38%, #ffc75b 72%, #ffa04c 100%);
      box-shadow:
        0 0 30px rgba(255,225,110,.55),
        0 0 90px rgba(255,196,77,.36);
      animation: breathe 5s ease-in-out infinite alternate;
    }

    .sun::before {
      content: "";
      position: absolute;
      inset: -38px;
      border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(255,235,150,.28) 0deg 3deg, transparent 3deg 24deg);
      -webkit-mask: radial-gradient(circle, transparent 0 56%, #000 58%);
      mask: radial-gradient(circle, transparent 0 56%, #000 58%);
      animation: spin 26s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe {
      from { transform: translateX(-50%) scale(.96); }
      to   { transform: translateX(-50%) scale(1.04); }
    }

    .moon {
      display: none;
      position: absolute;
      top: 22px;
      left: 50%;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle at 34% 30%, #fff, #e8efff 55%, #c3d0ea 100%);
      box-shadow: 0 0 70px rgba(215,228,255,.38);
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 80px;
      height: 80px;
      top: -7px;
      right: -21px;
      border-radius: 50%;
      background: var(--mid);
      opacity: .97;
    }

    .cloud {
      position: absolute;
      left: 50%;
      top: 78px;
      width: 190px;
      height: 62px;
      transform: translateX(-50%);
      border-radius: 80px;
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(225,236,247,.90));
      box-shadow: 0 16px 28px rgba(31,58,101,.16);
      opacity: 0;
      transition: opacity .6s ease;
      animation: cloudFloat 5.7s ease-in-out infinite alternate;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      bottom: 18px;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      width: 82px;
      height: 82px;
      left: 35px;
    }

    .cloud::after {
      width: 62px;
      height: 62px;
      right: 28px;
    }

    @keyframes cloudFloat {
      from { transform: translateX(-52%) translateY(0); }
      to   { transform: translateX(-48%) translateY(5px); }
    }

    .rain,
    .snow {
      position: absolute;
      left: 50%;
      top: 132px;
      width: 160px;
      height: 90px;
      transform: translateX(-50%);
      overflow: hidden;
      opacity: 0;
      transition: opacity .5s ease;
    }

    .rain i {
      position: absolute;
      top: -25px;
      width: 2px;
      height: 24px;
      border-radius: 99px;
      background: rgba(217,242,255,.85);
      transform: rotate(11deg);
      animation: rain 1.1s linear infinite;
    }

    .rain i:nth-child(1) { left: 13%; animation-delay: -.2s; }
    .rain i:nth-child(2) { left: 29%; animation-delay: -.7s; }
    .rain i:nth-child(3) { left: 46%; animation-delay: -.4s; }
    .rain i:nth-child(4) { left: 64%; animation-delay: -.9s; }
    .rain i:nth-child(5) { left: 82%; animation-delay: -.1s; }

    @keyframes rain {
      to { transform: translateY(125px) rotate(11deg); }
    }

    .snow i {
      position: absolute;
      top: -15px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      filter: blur(.2px);
      animation: snow 3.8s linear infinite;
    }

    .snow i:nth-child(1) { left: 12%; animation-delay: -.4s; }
    .snow i:nth-child(2) { left: 29%; animation-delay: -1.4s; }
    .snow i:nth-child(3) { left: 50%; animation-delay: -2.6s; }
    .snow i:nth-child(4) { left: 71%; animation-delay: -.9s; }
    .snow i:nth-child(5) { left: 88%; animation-delay: -2s; }

    @keyframes snow {
      0%   { transform: translate(0,0) scale(.7); }
      45%  { transform: translate(9px,55px) scale(1); }
      100% { transform: translate(-7px,110px) scale(.8); }
    }

    .lightning {
      opacity: 0;
      position: absolute;
      left: 54%;
      top: 121px;
      width: 22px;
      height: 50px;
      background: #fff3a6;
      clip-path: polygon(48% 0, 100% 0, 64% 37%, 95% 37%, 23% 100%, 43% 54%, 12% 54%);
      filter: drop-shadow(0 0 12px rgba(255,239,123,.9));
      animation: flash 2.5s steps(1) infinite;
    }

    @keyframes flash {
      0%, 82%, 100% { opacity: 0; }
      84%, 88% { opacity: 1; }
      86%, 90% { opacity: .25; }
    }

    .condition-cloud .cloud,
    .condition-rain .cloud,
    .condition-snow .cloud,
    .condition-storm .cloud,
    .condition-fog .cloud { opacity: 1; }

    .condition-rain .rain,
    .condition-storm .rain { opacity: 1; }

    .condition-snow .snow { opacity: 1; }
    .condition-storm .lightning { opacity: 1; }

    .night .sun { display: none; }
    .night .moon { display: block; }

    .temp {
      margin: -2px 0 0;
      font-size: clamp(76px, 18vw, 112px);
      line-height: .95;
      font-weight: 220;
      letter-spacing: -.06em;
      text-shadow: 0 8px 34px rgba(22,41,85,.16);
    }

    .condition {
      margin: 10px 0 4px;
      font-size: 22px;
      font-weight: 660;
    }

    .feels {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 520;
    }

    .updated {
      margin-top: 8px;
      color: rgba(255,255,255,.48);
      font-size: 12px;
    }

    .glass {
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.08));
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(125%);
      -webkit-backdrop-filter: blur(24px) saturate(125%);
    }

    .section {
      margin-top: 16px;
      padding: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 14px;
      color: rgba(255,255,255,.7);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 24px;
    }

    .metric {
      min-height: 112px;
      padding: 16px;
    }

    .metric-label {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 12px;
      color: rgba(255,255,255,.62);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .11em;
    }

    .metric-value {
      margin: 0;
      font-size: 27px;
      font-weight: 650;
      letter-spacing: -.03em;
    }

    .metric-sub {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .hourly {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 70px;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 1px 8px;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }

    .hourly::-webkit-scrollbar { display: none; }

    .hour {
      text-align: center;
      scroll-snap-align: start;
    }

    .hour-time {
      color: rgba(255,255,255,.72);
      font-size: 12px;
      font-weight: 600;
    }

    .hour-icon {
      display: grid;
      place-items: center;
      height: 40px;
      margin: 5px 0;
      font-size: 24px;
    }

    .hour-temp {
      font-size: 17px;
      font-weight: 680;
    }

    .hour-rain {
      min-height: 14px;
      margin-top: 4px;
      color: #cbeaff;
      font-size: 10px;
      font-weight: 700;
    }

    .daily {
      display: grid;
      gap: 0;
    }

    .day {
      display: grid;
      grid-template-columns: 74px 1fr 92px;
      gap: 10px;
      align-items: center;
      min-height: 51px;
      border-bottom: 1px solid rgba(255,255,255,.09);
    }

    .day:last-child { border-bottom: 0; }

    .day-name {
      font-size: 14px;
      font-weight: 650;
    }

    .day-mid {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.78);
      font-size: 19px;
    }

    .day-rain {
      color: #cbeaff;
      font-size: 10px;
      font-weight: 720;
    }

    .day-temp {
      text-align: right;
      font-size: 14px;
      font-weight: 650;
    }

    .day-temp span {
      color: rgba(255,255,255,.56);
      font-weight: 550;
    }

    .status {
      display: none;
      padding: 12px 15px;
      margin: 8px 0 0;
      border-radius: 16px;
      color: rgba(255,255,255,.9);
      background: rgba(23,33,71,.22);
      font-size: 13px;
      line-height: 1.4;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .status.show { display: block; }

    .loading {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      place-items: center;
      background: rgba(34,56,113,.26);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .loading.show { display: grid; }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spinLoader .8s linear infinite;
    }

    @keyframes spinLoader { to { transform: rotate(360deg); } }

    .footer {
      padding: 20px 4px 4px;
      color: rgba(255,255,255,.43);
      text-align: center;
      font-size: 11px;
    }

    @media (min-width: 620px) {
      .shell { padding-left: 24px; padding-right: 24px; }
      .hero { padding-top: 30px; }
      .metrics { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .metric { min-height: 124px; }
      .hourly { grid-auto-columns: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="app" id="app">
    <div class="ambient" aria-hidden="true">
      <div class="blob one"></div>
      <div class="blob two"></div>
    </div>

    <div class="loading" id="loading" aria-live="polite">
      <div class="spinner" aria-label="Loading weather"></div>
    </div>

    <div class="shell">
      <header class="topbar">
        <div class="location-title">
          <p class="eyebrow">Local weather</p>
          <h1 class="place" id="place">Finding your location…</h1>
        </div>

        <button class="icon-btn" id="locateBtn" aria-label="Use my location" title="Use my location">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="6.4" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
          </svg>
        </button>

        <button class="icon-btn" id="searchBtn" aria-label="Search city" title="Search city">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/>
            <path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <form class="search" id="searchForm">
        <input id="cityInput" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search city, e.g. Copenhagen" aria-label="City name" />
        <button type="submit">Search</button>
      </form>

      <div class="status" id="status"></div>

      <section class="hero" aria-live="polite">
        <div class="weather-stage" id="weatherStage" aria-hidden="true">
          <div class="sun"></div>
          <div class="moon"></div>
          <div class="cloud"></div>

          <div class="rain">
            <i></i><i></i><i></i><i></i><i></i>
          </div>

          <div class="snow">
            <i></i><i></i><i></i><i></i><i></i>
          </div>

          <div class="lightning"></div>
        </div>

        <div class="temp" id="temp">--°</div>
        <div class="condition" id="condition">Weather</div>
        <p class="feels" id="feels">Feels like --°</p>
        <div class="updated" id="updated"></div>
      </section>

      <section class="metrics">
        <article class="glass metric">
          <div class="metric-label">💧 HUMIDITY</div>
          <p class="metric-value" id="humidity">--%</p>
          <p class="metric-sub">Relative humidity</p>
        </article>

        <article class="glass metric">
          <div class="metric-label">💨 WIND</div>
          <p class="metric-value" id="wind">-- km/h</p>
          <p class="metric-sub" id="windDir">Wind direction</p>
        </article>

        <article class="glass metric">
          <div class="metric-label">☔ RAIN</div>
          <p class="metric-value" id="rainChance">--%</p>
          <p class="metric-sub">Next hour</p>
        </article>

        <article class="glass metric">
          <div class="metric-label">☀️ UV INDEX</div>
          <p class="metric-value" id="uv">--</p>
          <p class="metric-sub" id="uvLabel">Current UV</p>
        </article>
      </section>

      <section class="glass section">
        <div class="section-title">
          <span>Hourly forecast</span>
          <span>24 hours</span>
        </div>
        <div class="hourly" id="hourly"></div>
      </section>

      <section class="glass section">
        <div class="section-title">
          <span>7-day forecast</span>
          <span id="timezone"></span>
        </div>
        <div class="daily" id="daily"></div>
      </section>

      <footer class="footer">
        Forecast data: Open-Meteo • Location stays in your browser
      </footer>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const app = $("app");
    const stage = $("weatherStage");
    const loading = $("loading");
    const statusBox = $("status");
    const searchForm = $("searchForm");
    const searchBtn = $("searchBtn");
    const locateBtn = $("locateBtn");
    const cityInput = $("cityInput");

    const WMO = {
      0:  { text: "Clear sky",         icon: "☀️", kind: "clear" },
      1:  { text: "Mostly clear",      icon: "🌤️", kind: "cloud" },
      2:  { text: "Partly cloudy",     icon: "⛅️", kind: "cloud" },
      3:  { text: "Overcast",          icon: "☁️", kind: "cloud" },
      45: { text: "Fog",               icon: "🌫️", kind: "fog" },
      48: { text: "Rime fog",          icon: "🌫️", kind: "fog" },
      51: { text: "Light drizzle",     icon: "🌦️", kind: "rain" },
      53: { text: "Drizzle",           icon: "🌦️", kind: "rain" },
      55: { text: "Heavy drizzle",     icon: "🌧️", kind: "rain" },
      56: { text: "Freezing drizzle",  icon: "🌧️", kind: "rain" },
      57: { text: "Freezing drizzle",  icon: "🌧️", kind: "rain" },
      61: { text: "Light rain",        icon: "🌦️", kind: "rain" },
      63: { text: "Rain",              icon: "🌧️", kind: "rain" },
      65: { text: "Heavy rain",        icon: "🌧️", kind: "rain" },
      66: { text: "Freezing rain",     icon: "🌧️", kind: "rain" },
      67: { text: "Freezing rain",     icon: "🌧️", kind: "rain" },
      71: { text: "Light snow",        icon: "🌨️", kind: "snow" },
      73: { text: "Snow",              icon: "❄️", kind: "snow" },
      75: { text: "Heavy snow",        icon: "❄️", kind: "snow" },
      77: { text: "Snow grains",       icon: "🌨️", kind: "snow" },
      80: { text: "Light showers",     icon: "🌦️", kind: "rain" },
      81: { text: "Showers",           icon: "🌧️", kind: "rain" },
      82: { text: "Heavy showers",     icon: "⛈️", kind: "rain" },
      85: { text: "Snow showers",      icon: "🌨️", kind: "snow" },
      86: { text: "Heavy snow showers",icon: "❄️", kind: "snow" },
      95: { text: "Thunderstorm",      icon: "⛈️", kind: "storm" },
      96: { text: "Storm with hail",   icon: "⛈️", kind: "storm" },
      99: { text: "Severe storm",      icon: "⛈️", kind: "storm" }
    };

    function weatherInfo(code) {
      return WMO[code] || { text: "Weather", icon: "☁️", kind: "cloud" };
    }

    function setStatus(message = "") {
      statusBox.textContent = message;
      statusBox.classList.toggle("show", Boolean(message));
    }

    function setLoading(show) {
      loading.classList.toggle("show", show);
    }

    function round(value) {
      return Number.isFinite(value) ? Math.round(value) : "--";
    }

    // Plain fetch() can hang indefinitely on a filtered or dropped
    // connection (no response, no error) instead of failing outright,
    // which would leave the loading overlay stuck forever. Bound every
    // request so the UI always recovers.
    async function fetchWithTimeout(url, timeoutMs = 15000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    function compass(degrees) {
      if (!Number.isFinite(degrees)) return "Wind direction";
      const points = ["N","NE","E","SE","S","SW","W","NW"];
      return points[Math.round(degrees / 45) % 8] + " wind";
    }

    function uvDescription(value) {
      if (!Number.isFinite(value)) return "Current UV";
      if (value < 3) return "Low";
      if (value < 6) return "Moderate";
      if (value < 8) return "High";
      if (value < 11) return "Very high";
      return "Extreme";
    }

    function prettyHour(iso, index) {
      if (index === 0) return "Now";
      const d = new Date(iso);
      return new Intl.DateTimeFormat(undefined, { hour: "numeric" }).format(d);
    }

    function prettyDay(iso, index) {
      if (index === 0) return "Today";
      const d = new Date(iso + "T12:00:00");
      return new Intl.DateTimeFormat(undefined, { weekday: "short" }).format(d);
    }

    function palette(kind, isDay) {
      if (!isDay) {
        return ["#121a40", "#1f315f", "#262356"];
      }

      if (kind === "clear") return ["#76ceff", "#5b97ee", "#5056c9"];
      if (kind === "cloud") return ["#8cb9d3", "#6f8fab", "#596b92"];
      if (kind === "fog")   return ["#aabdc6", "#83959f", "#667887"];
      if (kind === "rain")  return ["#657f9e", "#445c78", "#34445f"];
      if (kind === "snow")  return ["#b9d9e7", "#8facbf", "#6f829d"];
      if (kind === "storm") return ["#38445f", "#252e4d", "#1e203a"];
      return ["#76ceff", "#5b97ee", "#5056c9"];
    }

    function updateScene(code, isDay) {
      const info = weatherInfo(code);
      const colors = palette(info.kind, isDay);

      document.documentElement.style.setProperty("--top", colors[0]);
      document.documentElement.style.setProperty("--mid", colors[1]);
      document.documentElement.style.setProperty("--bottom", colors[2]);

      stage.className = "weather-stage condition-" + info.kind + (isDay ? "" : " night");

      // At night, clouded conditions should still show the moon behind clouds.
      if (!isDay) {
        document.documentElement.style.setProperty("--orb", "rgba(225,235,255,.92)");
      }
    }

    async function fetchWeather(lat, lon, label = "Current location") {
      setLoading(true);
      setStatus("");

      const current = [
        "temperature_2m",
        "relative_humidity_2m",
        "apparent_temperature",
        "is_day",
        "precipitation",
        "weather_code",
        "wind_speed_10m",
        "wind_direction_10m"
      ].join(",");

      const hourly = [
        "temperature_2m",
        "precipitation_probability",
        "weather_code",
        "uv_index"
      ].join(",");

      const daily = [
        "weather_code",
        "temperature_2m_max",
        "temperature_2m_min",
        "precipitation_probability_max",
        "sunrise",
        "sunset",
        "uv_index_max"
      ].join(",");

      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.searchParams.set("latitude", lat);
      url.searchParams.set("longitude", lon);
      url.searchParams.set("current", current);
      url.searchParams.set("hourly", hourly);
      url.searchParams.set("daily", daily);
      url.searchParams.set("timezone", "auto");
      url.searchParams.set("forecast_days", "7");

      try {
        const response = await fetchWithTimeout(url);
        if (!response.ok) throw new Error("Weather service returned " + response.status);

        const data = await response.json();
        renderWeather(data, label);
      } catch (error) {
        console.error(error);
        const message = error.name === "AbortError"
          ? "The weather service is taking too long to respond. Check your internet connection and try again."
          : "Couldn't load the forecast. Check your internet connection and try again.";
        setStatus(message);
      } finally {
        setLoading(false);
      }
    }

    function renderWeather(data, label) {
      const c = data.current;
      const info = weatherInfo(c.weather_code);
      const isDay = c.is_day === 1;

      $("place").textContent = label;
      $("temp").textContent = `${round(c.temperature_2m)}°`;
      $("condition").textContent = info.text;
      $("feels").textContent = `Feels like ${round(c.apparent_temperature)}°`;
      $("humidity").textContent = `${round(c.relative_humidity_2m)}%`;
      $("wind").textContent = `${round(c.wind_speed_10m)} km/h`;
      $("windDir").textContent = compass(c.wind_direction_10m);
      $("timezone").textContent = data.timezone_abbreviation || "";

      const currentTime = c.time;
      const hTimes = data.hourly.time;
      let currentIndex = hTimes.findIndex(t => t >= currentTime);
      if (currentIndex < 0) currentIndex = 0;

      const nextRain = data.hourly.precipitation_probability[currentIndex];
      const currentUV = data.hourly.uv_index[currentIndex];

      $("rainChance").textContent = `${round(nextRain)}%`;
      $("uv").textContent = Number.isFinite(currentUV) ? currentUV.toFixed(1) : "--";
      $("uvLabel").textContent = uvDescription(currentUV);

      const updatedDate = new Date();
      $("updated").textContent =
        "Updated " +
        new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit" }).format(updatedDate);

      updateScene(c.weather_code, isDay);
      renderHourly(data, currentIndex);
      renderDaily(data);
    }

    function renderHourly(data, start) {
      const box = $("hourly");
      box.innerHTML = "";

      const max = Math.min(start + 24, data.hourly.time.length);

      for (let i = start; i < max; i++) {
        const info = weatherInfo(data.hourly.weather_code[i]);
        const rain = data.hourly.precipitation_probability[i];
        const el = document.createElement("div");
        el.className = "hour";

        el.innerHTML = `
          <div class="hour-time">${prettyHour(data.hourly.time[i], i - start)}</div>
          <div class="hour-icon" aria-hidden="true">${info.icon}</div>
          <div class="hour-temp">${round(data.hourly.temperature_2m[i])}°</div>
          <div class="hour-rain">${rain > 0 ? round(rain) + "%" : ""}</div>
        `;
        box.appendChild(el);
      }
    }

    function renderDaily(data) {
      const box = $("daily");
      box.innerHTML = "";

      data.daily.time.forEach((date, i) => {
        const info = weatherInfo(data.daily.weather_code[i]);
        const rain = data.daily.precipitation_probability_max[i] ?? 0;
        const el = document.createElement("div");
        el.className = "day";

        el.innerHTML = `
          <div class="day-name">${prettyDay(date, i)}</div>
          <div class="day-mid">
            <span aria-hidden="true">${info.icon}</span>
            <span class="day-rain">${rain > 0 ? round(rain) + "%" : ""}</span>
          </div>
          <div class="day-temp">
            ${round(data.daily.temperature_2m_max[i])}°
            <span>${round(data.daily.temperature_2m_min[i])}°</span>
          </div>
        `;
        box.appendChild(el);
      });
    }

    function useCurrentLocation() {
      setStatus("");

      if (!navigator.geolocation) {
        setStatus("Location isn't supported in this browser. Search for a city instead.");
        searchForm.classList.add("open");
        return;
      }

      setLoading(true);
      $("place").textContent = "Finding your location…";

      let settled = false;

      const fallbackToSearch = (message) => {
        if (settled) return;
        settled = true;
        setLoading(false);
        $("place").textContent = "Choose a location";
        setStatus(message);
        searchForm.classList.add("open");
        cityInput.focus();
      };

      // Browsers only start counting the PositionOptions timeout once the
      // permission prompt has been answered, so if it's never shown or never
      // answered (embedded views, blocked prompts, etc.) getCurrentPosition
      // can hang forever. This timer guarantees we still fall back.
      const stuckTimer = setTimeout(() => {
        fallbackToSearch(
          "Location is taking too long to respond. Allow location access, or search for a city below."
        );
      }, 12000);

      navigator.geolocation.getCurrentPosition(
        (position) => {
          if (settled) return;
          settled = true;
          clearTimeout(stuckTimer);
          const { latitude, longitude } = position.coords;
          fetchWeather(latitude, longitude, "Current location");
        },
        (error) => {
          console.warn(error);
          clearTimeout(stuckTimer);
          fallbackToSearch(
            "I couldn't access your location. Allow location access, or search for a city below. " +
            "Location usually requires the page to be opened from a secure HTTPS website."
          );
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 10 * 60 * 1000
        }
      );
    }

    async function searchCity(name) {
      const query = name.trim();
      if (query.length < 2) return;

      setLoading(true);
      setStatus("");

      try {
        const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
        url.searchParams.set("name", query);
        url.searchParams.set("count", "1");
        url.searchParams.set("language", navigator.language?.split("-")[0] || "en");
        url.searchParams.set("format", "json");

        const response = await fetchWithTimeout(url);
        if (!response.ok) throw new Error("Location search failed");

        const data = await response.json();
        const hit = data.results?.[0];

        if (!hit) {
          setStatus(`No location found for “${query}”. Try another spelling.`);
          return;
        }

        const label = [hit.name, hit.admin1, hit.country]
          .filter(Boolean)
          .filter((value, index, array) => array.indexOf(value) === index)
          .join(", ");

        await fetchWeather(hit.latitude, hit.longitude, label);
        searchForm.classList.remove("open");
        cityInput.blur();
      } catch (error) {
        console.error(error);
        const message = error.name === "AbortError"
          ? "The location search is taking too long to respond. Check your internet connection and try again."
          : "Couldn't search for that location. Please try again.";
        setStatus(message);
      } finally {
        setLoading(false);
      }
    }

    searchBtn.addEventListener("click", () => {
      searchForm.classList.toggle("open");
      if (searchForm.classList.contains("open")) {
        setTimeout(() => cityInput.focus(), 50);
      }
    });

    locateBtn.addEventListener("click", useCurrentLocation);

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      searchCity(cityInput.value);
    });

    // Start with local weather.
    useCurrentLocation();
  </script>
</body>
</html>
